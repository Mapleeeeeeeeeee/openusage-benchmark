<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>API Turn Timeline — OpenUsage Benchmark</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
  integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4"
  crossorigin="anonymous"></script>
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: -apple-system, system-ui, "Noto Sans TC", sans-serif; background: #fafafa; color: #1a1a1a; padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
.sub { font-size: 13px; color: #888; margin-bottom: 16px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.controls label { font-size: 12px; color: #666; }
.controls select { font-size: 13px; padding: 4px 8px; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
.card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.card-title { font-size: 14px; font-weight: 500; margin-bottom: 10px; }
.kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
.kpi { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px; text-align: center; }
.kpi .label { font-size: 11px; color: #888; }
.kpi .value { font-size: 18px; font-weight: 500; margin: 2px 0; }
.kpi .detail { font-size: 11px; color: #aaa; }
.chart-wrap { position: relative; height: 320px; }
.timeline { width: 100%; border-collapse: collapse; font-size: 12px; }
.timeline th { text-align: right; font-weight: 500; padding: 6px 8px; border-bottom: 2px solid #e5e5e5; color: #888; font-size: 11px; position: sticky; top: 0; background: #fff; z-index: 1; }
.timeline th:first-child, .timeline th:nth-child(2) { text-align: left; }
.timeline td { padding: 5px 8px; border-bottom: 1px solid #f0f0f0; text-align: right; font-variant-numeric: tabular-nums; }
.timeline td:first-child { text-align: center; color: #aaa; width: 30px; }
.timeline td:nth-child(2) { text-align: left; }
.timeline td:last-child { text-align: left; color: #888; font-size: 11px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; margin-right: 2px; }
.tool-Bash { background: #e8f5e9; color: #2e7d32; }
.tool-Read { background: #e3f2fd; color: #1565c0; }
.tool-Edit { background: #fff3e0; color: #e65100; }
.tool-Write { background: #fce4ec; color: #c62828; }
.tool-Agent { background: #f3e5f5; color: #7b1fa2; }
.tool-Grep { background: #e0f2f1; color: #00695c; }
.tool-Glob { background: #f1f8e9; color: #558b2f; }
.tool-default { background: #f5f5f5; color: #616161; }
.parallel-badge { background: #fff9c4; color: #f57f17; font-size: 10px; padding: 1px 4px; border-radius: 3px; margin-left: 4px; }
.scroll-wrap { max-height: 600px; overflow-y: auto; border: 1px solid #e5e5e5; border-radius: 8px; }
.delta-pos { color: #e53935; }
.delta-neg { color: #43a047; }
#loading { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }
</style>
</head>
<body>

<h1>Per-API-Request Timeline</h1>
<p class="sub">每個 API request 的 tool call、token 消耗、cache 變化</p>

<div class="controls">
  <label>Run:</label>
  <select id="sel-run">
    <option value="093511">Run 1 (Sonnet)</option>
    <option value="095143">Run 2 (Sonnet)</option>
    <option value="100737">Run 3 (Sonnet)</option>
  </select>
  <label>Scenario:</label>
  <select id="sel-scenario">
    <option value="s1">S1 裸機</option>
    <option value="s2">S2 CLAUDE.md</option>
    <option value="s3">S3 子代理</option>
    <option value="s4">S4 技能文件</option>
    <option value="s5">S5 全開</option>
  </select>
  <span id="turn-count" style="font-size:12px;color:#888;margin-left:8px"></span>
</div>

<div class="kpi-row" id="kpi-row"></div>

<div class="card">
  <div class="card-title">Cache 與 Output 趨勢</div>
  <div class="chart-wrap"><canvas id="chart-timeline"></canvas></div>
</div>

<div class="card">
  <div class="card-title">逐 Request 明細</div>
  <div class="scroll-wrap">
    <table class="timeline" id="timeline-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Tool</th>
          <th>Output</th>
          <th>Cache Read</th>
          <th>Cache Create</th>
          <th>Context</th>
          <th>描述</th>
        </tr>
      </thead>
      <tbody id="timeline-body"></tbody>
    </table>
  </div>
</div>

<p id="loading">載入中...</p>

<script>
const BASE = 'timeline/';
const cache = {};
let chart = null;

function fmt(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}

function toolClass(name) {
  const known = ['Bash','Read','Edit','Write','Agent','Grep','Glob'];
  return known.includes(name) ? `tool-${name}` : 'tool-default';
}

function renderToolTags(tools) {
  if (!tools.length) return '<span style="color:#bbb">text only</span>';
  return tools.map(t => `<span class="tool-tag ${toolClass(t)}">${t}</span>`).join('') +
    (tools.length > 1 ? '<span class="parallel-badge">parallel</span>' : '');
}

async function loadData(run, scenario) {
  const key = `run${run}_${scenario}`;
  if (cache[key]) return cache[key];
  const resp = await fetch(`${BASE}${key}.json`);
  if (!resp.ok) throw new Error(`${resp.status}`);
  const data = await resp.json();
  cache[key] = data;
  return data;
}

function renderKPIs(data) {
  const totalOutput = data.reduce((s, t) => s + t.usage.output, 0);
  const totalCacheRead = data.reduce((s, t) => s + t.usage.cache_read, 0);
  const totalCacheCreate = data.reduce((s, t) => s + t.usage.cache_create, 0);
  const lastContext = data.length ? data[data.length - 1].usage.cache_read + data[data.length - 1].usage.cache_create + data[data.length - 1].usage.input : 0;
  const parallelTurns = data.filter(t => t.tools.length > 1).length;

  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi"><div class="label">API Requests</div><div class="value">${data.length}</div></div>
    <div class="kpi"><div class="label">Total Output</div><div class="value">${fmt(totalOutput)}</div></div>
    <div class="kpi"><div class="label">Total Cache Read</div><div class="value">${fmt(totalCacheRead)}</div></div>
    <div class="kpi"><div class="label">Total Cache Create</div><div class="value">${fmt(totalCacheCreate)}</div></div>
    <div class="kpi"><div class="label">Parallel Turns</div><div class="value">${parallelTurns}</div><div class="detail">/ ${data.length} total</div></div>
  `;
}

function renderChart(data) {
  const ctx = document.getElementById('chart-timeline').getContext('2d');
  if (chart) chart.destroy();

  const labels = data.map((_, i) => i + 1);
  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Cache Read', data: data.map(t => t.usage.cache_read), backgroundColor: '#5DCAA5', order: 3 },
        { label: 'Cache Create', data: data.map(t => t.usage.cache_create), backgroundColor: '#85B7EB', order: 2 },
        { label: 'Output', data: data.map(t => t.usage.output), backgroundColor: '#ED93B1', order: 1 },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        tooltip: {
          callbacks: {
            afterTitle: (items) => {
              const d = data[items[0].dataIndex];
              return d.tools.length ? d.tools.join(' + ') : 'text only';
            },
            label: (item) => `${item.dataset.label}: ${fmt(item.raw)}`
          }
        },
        legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } }
      },
      scales: {
        x: { stacked: true, title: { display: true, text: 'API Request #', font: { size: 11 } }, ticks: { font: { size: 10 } } },
        y: { stacked: true, title: { display: true, text: 'Tokens', font: { size: 11 } }, ticks: { callback: v => fmt(v), font: { size: 10 } } }
      }
    }
  });
}

function renderTable(data) {
  const tbody = document.getElementById('timeline-body');
  tbody.innerHTML = data.map((t, i) => {
    const ctx = t.usage.input + t.usage.cache_read + t.usage.cache_create;
    const prevCtx = i > 0 ? data[i-1].usage.input + data[i-1].usage.cache_read + data[i-1].usage.cache_create : 0;
    const delta = ctx - prevCtx;
    const deltaStr = i === 0 ? '' : delta >= 0
      ? `<span class="delta-pos">+${fmt(delta)}</span>`
      : `<span class="delta-neg">${fmt(delta)}</span>`;
    const desc = t.text ? t.text.replace(/</g, '&lt;') : '';
    return `<tr>
      <td>${i + 1}</td>
      <td>${renderToolTags(t.tools)}</td>
      <td>${fmt(t.usage.output)}</td>
      <td>${fmt(t.usage.cache_read)}</td>
      <td>${fmt(t.usage.cache_create)}</td>
      <td>${fmt(ctx)} ${deltaStr}</td>
      <td title="${desc}">${desc}</td>
    </tr>`;
  }).join('');
}

async function update() {
  const run = document.getElementById('sel-run').value;
  const scenario = document.getElementById('sel-scenario').value;
  document.getElementById('loading').style.display = 'block';
  try {
    const data = await loadData(run, scenario);
    document.getElementById('turn-count').textContent = `${data.length} API requests`;
    renderKPIs(data);
    renderChart(data);
    renderTable(data);
    document.getElementById('loading').style.display = 'none';
  } catch (e) {
    document.getElementById('loading').textContent = `載入失敗: ${e.message}`;
  }
}

document.getElementById('sel-run').addEventListener('change', update);
document.getElementById('sel-scenario').addEventListener('change', update);
update();
</script>
</body>
</html>
